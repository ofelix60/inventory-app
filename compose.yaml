services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
      POSTGRES_DB: inventory
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U inventory']
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  server:
    build: ./server
    environment:
      DATABASE_URL: postgres://inventory:inventory@db:5432/inventory
      DB_SSL: 'false'
      SECRET: local-dev-secret
      CLIENT_URL: http://localhost:3000
      PORT: '8000'
    ports:
      - '8000:8000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        REACT_APP_BASEURL: http://localhost:8000/api/
    ports:
      - '3000:80'
    depends_on:
      - server

volumes:
  db_data:
