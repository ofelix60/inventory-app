name: Deploy to AWS ECS

on:
  workflow_dispatch: # manual only: Actions tab → "Deploy to AWS ECS" → Run workflow

permissions:
  id-token: write # lets the job request a GitHub OIDC token to exchange for AWS creds
  contents: read

concurrency:
  group: deploy-production # never run two deploys at once
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production # pauses here until a required reviewer approves
    defaults:
      run:
        working-directory: infra
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: GitHub-OIDC-TERRAFORM

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.5

      - name: Terraform init
        env:
          AWS_BUCKET_NAME: ${{ secrets.AWS_BUCKET_NAME }}
          AWS_BUCKET_KEY_NAME: ${{ secrets.AWS_BUCKET_KEY_NAME }}
        run: >
          terraform init -input=false
          -backend-config="bucket=${AWS_BUCKET_NAME}"
          -backend-config="key=${AWS_BUCKET_KEY_NAME}"
          -backend-config="region=${AWS_REGION}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply (the saved plan, nothing else)
        run: terraform apply -input=false tfplan
